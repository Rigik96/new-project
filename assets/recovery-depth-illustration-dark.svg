<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Нейтральная иллюстрация восстановления ресурса: сон, прогулка и возвращение энергии">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="54%" r="68%">
      <stop offset="0" stop-color="#b8ff2c" stop-opacity=".26"/>
      <stop offset=".45" stop-color="#51efaf" stop-opacity=".12"/>
      <stop offset="1" stop-color="#050506" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#11131a"/>
      <stop offset=".55" stop-color="#090b0e"/>
      <stop offset="1" stop-color="#020304"/>
    </linearGradient>
    <linearGradient id="batteryFill" x1="0" x2="1">
      <stop offset="0" stop-color="#b8ff2c"/>
      <stop offset=".55" stop-color="#84f27f"/>
      <stop offset="1" stop-color="#63f2c1"/>
    </linearGradient>
    <linearGradient id="pathGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#b8ff2c" stop-opacity=".04"/>
      <stop offset=".58" stop-color="#b8ff2c" stop-opacity=".58"/>
      <stop offset="1" stop-color="#63f2c1" stop-opacity=".18"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#bgGlow)"/>

  <g opacity=".7">
    <circle cx="228" cy="148" r="58" fill="#eef9d8" opacity=".9"/>
    <circle cx="254" cy="130" r="62" fill="#090b0e"/>
    <path d="M304 126h46m-23-23v46M938 126h28m-14-14v28M1004 214h38m-19-19v38" stroke="#b8ff2c" stroke-width="5" stroke-linecap="round" opacity=".5"/>
  </g>

  <g filter="url(#glow)">
    <path d="M178 596c118-110 244-166 378-168 162-2 284 68 466 8" fill="none" stroke="url(#pathGlow)" stroke-width="96" stroke-linecap="round" opacity=".38"/>
    <path d="M178 596c118-110 244-166 378-168 162-2 284 68 466 8" fill="none" stroke="#b8ff2c" stroke-width="8" stroke-linecap="round" opacity=".82"/>
    <path d="M220 630c108-78 220-114 336-108 126 6 246 58 410 20" fill="none" stroke="#63f2c1" stroke-width="5" stroke-linecap="round" opacity=".52"/>
  </g>

  <g transform="translate(342 176)" filter="url(#glow)">
    <rect x="0" y="0" width="516" height="252" rx="54" fill="#12151b" stroke="#ffffff" stroke-opacity=".16" stroke-width="3"/>
    <rect x="516" y="82" width="40" height="88" rx="18" fill="#12151b" stroke="#ffffff" stroke-opacity=".16" stroke-width="3"/>
    <rect x="36" y="36" width="342" height="180" rx="34" fill="#1b2024"/>
    <rect x="36" y="36" width="286" height="180" rx="34" fill="url(#batteryFill)"/>
    <path d="M89 156c44-66 108-98 192-94 46 2 86 15 120 39" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity=".42"/>
    <circle cx="424" cy="86" r="22" fill="#b8ff2c"/>
    <circle cx="424" cy="164" r="22" fill="#63f2c1"/>
  </g>

  <g opacity=".9" filter="url(#glow)">
    <path d="M806 536c36-56 92-84 168-84-18 62-62 100-132 113" fill="#b8ff2c" opacity=".75"/>
    <path d="M819 556c42-30 88-52 138-66" fill="none" stroke="#0c2b0f" stroke-width="6" stroke-linecap="round" opacity=".48"/>
    <path d="M260 486c-38-48-92-68-162-60 24 54 68 84 132 90" fill="#63f2c1" opacity=".55"/>
    <path d="M244 502c-34-24-72-40-114-49" fill="none" stroke="#102f2a" stroke-width="5" stroke-linecap="round" opacity=".45"/>
  </g>

  <g opacity=".88">
    <rect x="172" y="642" width="220" height="16" rx="8" fill="#b8ff2c"/>
    <rect x="172" y="672" width="330" height="12" rx="6" fill="#ffffff" opacity=".48"/>
    <rect x="172" y="696" width="152" height="12" rx="6" fill="#63f2c1" opacity=".6"/>
  </g>
</svg>
