<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Нейтральная иллюстрация восстановления ресурса: сон, прогулка и возвращение энергии">
  <defs>
    <radialGradient id="softBg" cx="50%" cy="54%" r="68%">
      <stop offset="0" stop-color="#b8ff2c" stop-opacity=".24"/>
      <stop offset=".52" stop-color="#67efcf" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f8f7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".58" stop-color="#f6f5ff"/>
      <stop offset="1" stop-color="#edf8f3"/>
    </linearGradient>
    <linearGradient id="batteryFill" x1="0" x2="1">
      <stop offset="0" stop-color="#b8ff2c"/>
      <stop offset=".55" stop-color="#88f074"/>
      <stop offset="1" stop-color="#5fe2c6"/>
    </linearGradient>
    <linearGradient id="pathGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#3d3bff" stop-opacity=".04"/>
      <stop offset=".58" stop-color="#8fe51e" stop-opacity=".5"/>
      <stop offset="1" stop-color="#35d5b6" stop-opacity=".2"/>
    </linearGradient>
    <filter id="lightGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="softGrid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#3d3bff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#paper)"/>
  <rect width="1200" height="750" fill="url(#softGrid)"/>
  <rect width="1200" height="750" fill="url(#softBg)"/>

  <g opacity=".86">
    <circle cx="228" cy="148" r="58" fill="#111217" opacity=".12"/>
    <circle cx="254" cy="130" r="62" fill="#f8f7ff"/>
    <path d="M304 126h46m-23-23v46M938 126h28m-14-14v28M1004 214h38m-19-19v38" stroke="#91dc20" stroke-width="5" stroke-linecap="round" opacity=".66"/>
  </g>

  <g filter="url(#lightGlow)">
    <path d="M178 596c118-110 244-166 378-168 162-2 284 68 466 8" fill="none" stroke="url(#pathGlow)" stroke-width="96" stroke-linecap="round" opacity=".45"/>
    <path d="M178 596c118-110 244-166 378-168 162-2 284 68 466 8" fill="none" stroke="#8fe51e" stroke-width="8" stroke-linecap="round" opacity=".88"/>
    <path d="M220 630c108-78 220-114 336-108 126 6 246 58 410 20" fill="none" stroke="#35d5b6" stroke-width="5" stroke-linecap="round" opacity=".58"/>
  </g>

  <g transform="translate(342 176)" filter="url(#lightGlow)">
    <rect x="0" y="0" width="516" height="252" rx="54" fill="#ffffff" stroke="#2e3040" stroke-opacity=".14" stroke-width="3"/>
    <rect x="516" y="82" width="40" height="88" rx="18" fill="#ffffff" stroke="#2e3040" stroke-opacity=".14" stroke-width="3"/>
    <rect x="36" y="36" width="342" height="180" rx="34" fill="#eeedf8"/>
    <rect x="36" y="36" width="286" height="180" rx="34" fill="url(#batteryFill)"/>
    <path d="M89 156c44-66 108-98 192-94 46 2 86 15 120 39" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity=".56"/>
    <circle cx="424" cy="86" r="22" fill="#b8ff2c"/>
    <circle cx="424" cy="164" r="22" fill="#5fe2c6"/>
  </g>

  <g opacity=".9" filter="url(#lightGlow)">
    <path d="M806 536c36-56 92-84 168-84-18 62-62 100-132 113" fill="#91dc20" opacity=".75"/>
    <path d="M819 556c42-30 88-52 138-66" fill="none" stroke="#385100" stroke-width="6" stroke-linecap="round" opacity=".32"/>
    <path d="M260 486c-38-48-92-68-162-60 24 54 68 84 132 90" fill="#35d5b6" opacity=".5"/>
    <path d="M244 502c-34-24-72-40-114-49" fill="none" stroke="#255850" stroke-width="5" stroke-linecap="round" opacity=".32"/>
  </g>

  <g opacity=".82">
    <rect x="172" y="642" width="220" height="16" rx="8" fill="#91dc20"/>
    <rect x="172" y="672" width="330" height="12" rx="6" fill="#2e3040" opacity=".26"/>
    <rect x="172" y="696" width="152" height="12" rx="6" fill="#35d5b6" opacity=".58"/>
  </g>
</svg>
