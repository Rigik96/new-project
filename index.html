<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Что на самом деле не так?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="phone" aria-live="polite">
        <header class="topbar">
          <button class="icon-button" id="backButton" type="button" aria-label="Назад">
            <span aria-hidden="true">‹</span>
          </button>
          <div class="progress-wrap" aria-label="Прогресс квиза">
            <div class="progress-meta">
              <span id="stepLabel">1 из 24</span>
              <span id="timeLabel">4 минуты</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>
        </header>

        <div class="screen" id="quizScreen"></div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
